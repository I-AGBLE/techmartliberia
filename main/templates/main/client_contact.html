{% extends 'main/layout.html' %}
{% load static %}

{% block content %}
<div class="form_field" id="form_field_for_table">
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Tel</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for contact in client_contact %}
            <tr>
                <td>{{ contact.name }}</td>
                <td>{{ contact.email }}</td>
                <td>{{contact.tel }}</td>
                <td><a href="{% url 'main:contact_detail' contact.id %}"><i class="fa-solid fa-eye"></i></a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
