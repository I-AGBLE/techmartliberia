{% extends 'main/layout.html' %}

{% load static %}

{% block content %}
<div class="form_field">
    <h2>Edit About Us Hero Section</h2>

    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li {% if message.tags %} class="{{ message.tags }}" {% endif %}>
            {{ message }}
        </li>
        {% endfor %}
    </ul>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <input type="text" name="about_hero_text_title" id="about_hero_text_title"
            value="{{ about_hero.about_hero_text_title }}" placeholder="Enter About Us Hero Title" maxlength="110"
            required>

        <input type="text" name="mandatory_field" id="mandatory_field" value="{{ about_hero.mandatory_field }}"
            placeholder="This field is mandatory">

        <textarea name="about_hero_text_body" id="about_hero_text_body" placeholder="Enter About Us Hero Text"
            maxlength="650">{{ about_hero.about_hero_text_body }}</textarea>

        <input type="file" name="about_hero_image" id="about_hero_image" accept=".jpeg,.jpg,.png,image/jpeg,image/png">

        {% if about_hero.about_hero_image %}
        <img src="{{ about_hero.about_hero_image.url }}" alt="{{ about_hero.about_hero_text_title }}" width=200
            height=200 />
        {% endif %}

        <input type="submit" class="submit" value="Update">
</div>
{% endblock %}
